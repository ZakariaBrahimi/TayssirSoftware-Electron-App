name: Release Android app

# Builds the Android app (mobile/) and publishes Mizan-POS.apk on the
# GitHub release "android":
#   https://github.com/<owner>/<repo>/releases/download/android/Mizan-POS.apk
# The app opens the cloud app, so web changes reach phones without a new
# APK; this only runs when the Android project itself changes.
#
# Optional secrets (see mobile/README.md):
# - ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD: the release signing key. Without them the APK is
#   signed with a throwaway key and must be reinstalled to update.
# - GOOGLE_SERVICES_JSON: Firebase config, for push notifications.
on:
  push:
    branches:
      - main
      # Branch of the pending Mizan pull request; remove once it is merged.
      - ccr-6e8e360f-qssrnw
    paths:
      - mobile/**
      - .github/workflows/release-android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK packages
        # The runner has the Android SDK; add this app's platform if missing.
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - run: npm ci
      - run: npx cap sync android

      - name: Firebase config (push notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Push notifications enabled."
          else
            echo "No GOOGLE_SERVICES_JSON: building without push notifications."
          fi

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a temporary key (updates need a reinstall)."
          fi

      - name: Build the APK
        working-directory: mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Mizan-POS.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Mizan-POS-apk
          path: Mizan-POS.apk

      - name: Publish on the "android" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES="Mizan POS for Android 1.0.${{ github.run_number }}. Download Mizan-POS.apk and open it on the phone (allow installing from this source)."
          if ! gh release view android > /dev/null 2>&1; then
            # Not "latest": that stays the desktop release.
            gh release create android --target "$GITHUB_SHA" --title "Mizan POS for Android" --notes "$NOTES" --latest=false
          else
            gh release edit android --notes "$NOTES" --latest=false
          fi
          gh release upload android "$GITHUB_WORKSPACE/Mizan-POS.apk" --clobber
