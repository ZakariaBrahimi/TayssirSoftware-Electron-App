name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace @tayssir/web --include-workspace-root
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
