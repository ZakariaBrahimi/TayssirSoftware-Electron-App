<!doctype html>
<html><head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&amp;family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #0E7C6B; --teal-d: #0A5C50; --ink: #0B2B27; --ink2: #123A35;
    --gold: #D6A23A; --cream: #F6F2E9; --paper: #FFFDF8; --muted: #5E716D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: Geist, "Readex Pro", sans-serif; color: var(--ink); }
  .post { position: relative; overflow: hidden; margin: 0 0 40px; }
  .sq { width: 1080px; height: 1080px; }
  .story { width: 1080px; height: 1920px; }
  .cover { width: 1640px; height: 624px; }
  .ar { font-family: "Readex Pro", sans-serif; direction: rtl; }

  .logo { display: flex; align-items: center; gap: 18px; font-weight: 700; font-size: 40px; letter-spacing: -0.5px; }
  .logo svg { width: 64px; height: 64px; }
  .eyebrow { font-weight: 600; font-size: 26px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); }
  .ar .eyebrow { letter-spacing: 0; }
  h1 { font-family: "Readex Pro", sans-serif; font-weight: 700; letter-spacing: -2px; line-height: 1.02; }
  .ar h1 { letter-spacing: 0; line-height: 1.25; }
  .pill { display: inline-flex; align-items: center; gap: 12px; border-radius: 999px; padding: 18px 34px; font-weight: 700; font-size: 30px; }
  .url { font-weight: 500; font-size: 26px; opacity: .75; }

  /* receipt-like POS mock */
  .till { background: var(--paper); border-radius: 28px; box-shadow: 0 40px 80px rgba(0,0,0,.35); padding: 34px; color: var(--ink); }
  .till .row { display: flex; justify-content: space-between; font-size: 26px; padding: 12px 0; border-bottom: 2px dashed #e4ddcc; }
  .till .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  .till .total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; font-size: 30px; font-weight: 600; }
  .till .total b { font-size: 54px; color: var(--teal); font-variant-numeric: tabular-nums; }
  .till .charge { margin-top: 22px; background: var(--teal); color: #fff; text-align: center; border-radius: 18px; padding: 22px; font-size: 32px; font-weight: 700; }
  .badge { display: inline-flex; align-items: center; gap: 10px; background: #FFF4DC; color: #8A5A00; border-radius: 999px; padding: 10px 20px; font-size: 22px; font-weight: 600; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); }

  .grid-bg { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 2px, transparent 2px); background-size: 36px 36px; }
  .on-teal .logo svg rect { fill: #0B2B27; }
  .chip { display:flex; align-items:center; gap:14px; background: rgba(255,255,255,.1); border-radius: 22px; padding: 22px 26px; font-size: 28px; font-weight: 500; }
  .coin { position: absolute; border-radius: 50%; border: 40px solid rgba(255,255,255,.06); }
</style>
</head>
<body style="margin:0">

    </div>
  </div>
</section>
</body></html>
