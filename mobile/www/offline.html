<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mizan POS</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f6faf9; color: #0b2e2a; text-align: center; padding: 24px; box-sizing: border-box; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { margin: 4px 0; color: #4b6360; }
      button { margin-top: 20px; padding: 12px 28px; border: 0; border-radius: 10px; background: #0f766e; color: #fff; font-size: 1rem; }
    </style>
  </head>
  <body>
    <div>
      <h1>Pas de connexion · لا يوجد اتصال · No connection</h1>
      <p>Vérifiez Internet puis réessayez.</p>
      <p dir="rtl">تحقق من الإنترنت ثم أعد المحاولة.</p>
      <p>Check the internet connection and try again.</p>
      <button onclick="history.length > 1 ? history.back() : location.reload()">Réessayer · إعادة المحاولة</button>
    </div>
  </body>
</html>
